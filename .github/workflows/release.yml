name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --version=${GITHUB_REF_NAME#v}
      # 커밋된 산출물이 소스에서 빌드한 결과와 같은지 확인한다.
      # Greasy Fork 웹훅이 읽는 것은 릴리스 에셋이 아니라 이 커밋된 파일이다.
      - name: Verify committed artifact
        run: diff -u mullive-plusplus.user.js dist/mullive-plusplus.user.js
      - run: gh release create "$GITHUB_REF_NAME" mullive-plusplus.user.js --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
